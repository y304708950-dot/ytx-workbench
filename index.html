<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>幼小衔接学习桌面</title>
  <style>
    :root{
      --cream:#fffaf0; --paper:#fffdf7; --ink:#2c3440; --muted:#687484;
      --blue:#d8ecff; --yellow:#fff0b8; --green:#e2f7d4; --pink:#fce0e9;
      --line:#e8dfcf; --accent:#4c8fd9; --good:#25845f; --bad:#b86445;
      --shadow:0 12px 28px rgba(68,83,103,.13);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(216,236,255,.75), transparent 30%),
        linear-gradient(135deg,#fffaf0 0%,#f6fbff 48%,#fff9dc 100%);
      letter-spacing:0;
    }
    button,input,textarea,select{font:inherit}
    button{
      border:0;
      border-radius:8px;
      min-height:44px;
      padding:10px 14px;
      background:#fff;
      color:var(--ink);
      box-shadow:0 1px 0 rgba(0,0,0,.08), inset 0 0 0 1px var(--line);
      cursor:pointer;
    }
    button:hover{transform:translateY(-1px)}
    button:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .app{min-height:100vh;display:flex}
    .side{
      width:22%;
      min-width:244px;
      max-width:340px;
      padding:18px 14px;
      background:rgba(255,253,247,.88);
      border-right:1px solid var(--line);
      position:sticky;
      top:0;
      height:100vh;
      overflow:auto;
      backdrop-filter:blur(10px);
    }
    .kid-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:8px;
      padding:14px;
      box-shadow:var(--shadow);
      margin-bottom:12px;
    }
    .kid-row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
    .avatar{width:46px;height:46px;border-radius:8px;background:var(--blue);display:grid;place-items:center;font-size:26px}
    .kid-name{
      width:100%;
      border:1px solid var(--line);
      border-radius:8px;
      padding:9px 10px;
      font-size:18px;
      background:#fffdf7;
      font-weight:700;
    }
    .small{font-size:13px;color:var(--muted);line-height:1.45}
    .progress-bar{height:10px;background:#edf1f4;border-radius:999px;overflow:hidden;margin-top:8px}
    .progress-fill{height:100%;background:linear-gradient(90deg,#7bcfa6,#63a8e6);width:0%}
    .nav-list{display:grid;gap:8px}
    .nav-btn{
      width:100%;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:flex-start;
      text-align:left;
      background:#fff;
      min-height:54px;
      font-weight:800;
    }
    .nav-btn.active{background:#eaf5ff;box-shadow:inset 0 0 0 2px #72aeea}
    .nav-icon{font-size:25px;width:32px;text-align:center}
    .nav-meta{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
    .main{
      width:78%;
      padding:18px clamp(14px,2vw,28px) 88px;
      overflow:auto;
    }
    .topline{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
    .section-title h1{font-size:clamp(25px,3vw,42px);margin:0 0 5px;line-height:1.1;letter-spacing:0}
    .section-title p{margin:0;color:var(--muted);font-size:16px;line-height:1.45}
    .pill{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:7px 11px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
    .lesson-strip{display:flex;gap:10px;overflow:auto;padding:5px 2px 12px;margin-bottom:8px}
    .lesson-tab{
      flex:0 0 auto;
      min-width:132px;
      max-width:180px;
      white-space:normal;
      line-height:1.2;
      font-weight:800;
      background:#fff;
    }
    .lesson-tab.active{background:#fff5c9;box-shadow:inset 0 0 0 2px #e5b84f}
    .workbench{
      display:grid;
      grid-template-columns:minmax(270px,38%) 1fr;
      gap:16px;
      align-items:start;
    }
    .panel{
      background:rgba(255,255,255,.9);
      border:1px solid var(--line);
      border-radius:8px;
      box-shadow:var(--shadow);
      padding:16px;
    }
    .card-stage{text-align:center}
    .card-image{font-size:52px;line-height:1.1;min-height:58px;display:grid;place-items:center;margin:4px 0}
    .big-card{
      min-height:132px;
      border-radius:8px;
      display:grid;
      place-items:center;
      padding:14px;
      background:linear-gradient(180deg,#fffef8,#edf8ff);
      border:1px solid #dcebf5;
      font-weight:900;
      font-size:clamp(42px,6vw,74px);
      line-height:1.1;
      word-break:break-word;
    }
    .card-title{font-size:21px;font-weight:900;margin:12px 0 6px}
    .hint,.story{font-size:17px;line-height:1.65;color:#3f4a56}
    .story{text-align:left;background:#fffaf0;border:1px dashed #e7ca7a;border-radius:8px;padding:12px}
    .steps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
    .step{background:#edf7e8;border:1px solid #c9e8bd;border-radius:999px;padding:6px 10px;font-size:14px}
    .card-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
    .primary{background:#4c8fd9;color:#fff;box-shadow:none}
    .soft{background:#f7fbff}
    .good{background:#eaf8f0;color:#176b4d}
    .warn{background:#fff1e8;color:#965034}
    .exercise-list{display:grid;gap:12px}
    .exercise{border:1px solid var(--line);border-radius:8px;background:#fff;padding:13px}
    .exercise h3{font-size:18px;margin:0 0 10px;line-height:1.35}
    .choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:9px}
    .choice-grid button{font-size:18px;font-weight:800;min-height:50px;white-space:normal}
    .feedback{margin-top:10px;padding:10px;border-radius:8px;font-weight:800;line-height:1.45}
    .feedback.ok{background:#eaf8f0;color:#1a6d50}
    .feedback.no{background:#fff0e7;color:#965034}
    .order-pick,.token-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
    .token{background:#eef6ff;border:1px solid #cbdff1;border-radius:8px;padding:9px 11px;min-height:42px;display:inline-flex;align-items:center}
    .match-row{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;margin:8px 0}
    .left-token{font-size:22px;font-weight:900;text-align:center;background:#fff8dc;border-radius:8px;padding:10px;border:1px solid #eadc96}
    .spot-grid,.maze-grid{display:grid;gap:6px;justify-content:start}
    .spot-grid button,.maze-grid button{width:48px;height:48px;min-height:48px;padding:0;font-size:24px}
    .maze-grid button.wall{background:#667085;color:#fff;cursor:not-allowed}
    .maze-grid button.onpath{background:#d8ecff}
    .maze-grid button.done{background:#91d7b4}
    .memory-box{font-size:34px;font-weight:900;background:#fff8dc;border:1px solid #eadc96;border-radius:8px;padding:14px;text-align:center;margin:8px 0}
    .results-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    .result-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:var(--shadow)}
    .result-card h3{margin:0 0 7px;font-size:19px}
    .recent{display:grid;gap:8px;margin-top:10px}
    .recent-item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;justify-content:space-between;gap:10px}
    .parent-entry{
      position:fixed;right:18px;bottom:18px;z-index:20;
      background:#2f4154;color:#fff;box-shadow:var(--shadow);font-weight:900;
    }
    .modal{position:fixed;inset:0;background:rgba(36,45,54,.46);z-index:30;display:none;padding:18px}
    .modal.open{display:block}
    .editor{
      height:100%;
      background:#fffdf7;
      border-radius:8px;
      display:grid;
      grid-template-columns:280px 1fr;
      overflow:hidden;
      box-shadow:0 18px 60px rgba(0,0,0,.25);
      border:1px solid var(--line);
    }
    .editor-side{border-right:1px solid var(--line);padding:12px;overflow:auto;background:#f8fbff}
    .editor-main{padding:14px;overflow:auto}
    .editor-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .tree-btn{width:100%;text-align:left;margin-bottom:6px;display:flex;align-items:center;gap:8px;font-weight:800}
    .tree-btn.lesson{margin-left:18px;width:calc(100% - 18px);font-weight:650;min-height:38px;font-size:14px}
    .tree-btn.active{background:#fff0b8;box-shadow:inset 0 0 0 2px #ddb44d}
    .field{margin:9px 0}
    .field label{display:block;font-size:13px;color:#53606e;font-weight:800;margin-bottom:4px}
    .field input,.field textarea,.field select{
      width:100%;
      border:1px solid var(--line);
      border-radius:8px;
      padding:9px 10px;
      background:#fff;
      min-height:42px;
    }
    .field textarea{min-height:78px;resize:vertical;line-height:1.5}
    .array-box{border:1px solid #eadfc9;border-radius:8px;margin:10px 0;padding:10px;background:#fff}
    .array-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}
    .item-card{border:1px solid var(--line);background:#fffdf7;border-radius:8px;padding:10px;margin:8px 0}
    .item-actions{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
    .mini{min-height:34px;padding:6px 9px;font-size:13px}
    .file-input{display:none}
    @media (max-width: 760px), (orientation: portrait) {
      .app{display:block}
      .side{width:100%;max-width:none;min-width:0;height:auto;position:sticky;z-index:10;border-right:0;border-bottom:1px solid var(--line);padding:10px}
      .kid-card{margin-bottom:8px;padding:10px}
      .kid-row{margin-bottom:6px}
      .avatar{width:38px;height:38px;font-size:22px}
      .kid-name{font-size:16px}
      .nav-list{display:flex;overflow:auto;gap:8px;padding-bottom:4px}
      .nav-btn{flex:0 0 142px;min-height:50px}
      .main{width:100%;padding:12px 10px 84px}
      .topline{display:block}
      .workbench{grid-template-columns:1fr}
      .lesson-tab{min-width:126px}
      .choice-grid{grid-template-columns:1fr 1fr}
      .editor{grid-template-columns:1fr;height:100%}
      .editor-side{max-height:34vh;border-right:0;border-bottom:1px solid var(--line)}
      .editor-main{min-height:0}
      .modal{padding:8px}
    }
    @media (max-width: 430px) {
      .choice-grid{grid-template-columns:1fr}
      .big-card{font-size:40px}
      .spot-grid button,.maze-grid button{width:42px;height:42px;min-height:42px}
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <button id="parentEntry" class="parent-entry" title="家长编辑">⚙️ 家长编辑</button>
  <div id="editorModal" class="modal" aria-hidden="true"></div>
  <script id="default-content" type="application/json">
  {
  "version": 1,
  "childName": "小朋友",
  "theme": "幼小衔接学习桌面",
  "sections": [
    {
      "id": "pinyin",
      "title": "拼音乐园",
      "icon": "🔤",
      "color": "#d8ecff",
      "lessons": [
        {
          "id": "pinyin-initials",
          "title": "声母小火车",
          "icon": "🚂",
          "type": "pinyin",
          "objective": "认识 b p m f d t n l 这些常见声母。",
          "cards": [
            {"big": "b", "title": "声母 b", "image": "🧸", "hint": "像广播开头的轻短声，不拖长。", "mouth": "双唇先闭住，再轻轻打开。", "say": "b"},
            {"big": "p", "title": "声母 p", "image": "🍑", "hint": "像吹出一口小气。", "mouth": "双唇闭住后送出气流。", "say": "p"},
            {"big": "m", "title": "声母 m", "image": "🐴", "hint": "嘴巴闭着，声音从鼻子出来。", "mouth": "双唇闭合，鼻腔轻轻振动。", "say": "m"},
            {"big": "f", "title": "声母 f", "image": "🍚", "hint": "上牙轻碰下唇。", "mouth": "牙齿轻碰下嘴唇，送出细气。", "say": "f"}
          ],
          "exercises": [
            {"kind": "choice", "prompt": "听家长读“b”，选出对应的声母。", "answer": "b", "options": ["b", "p", "m", "f"], "tip": "b 的嘴巴先闭住再打开。"},
            {"kind": "choice", "prompt": "哪个声母发音时要送出明显气流？", "answer": "p", "options": ["b", "p", "m", "l"], "tip": "p 像轻轻吹蜡烛。"}
          ]
        },
        {
          "id": "pinyin-finals",
          "title": "韵母花园",
          "icon": "🌼",
          "type": "pinyin",
          "objective": "认识 a o e i u ü，并观察口型变化。",
          "cards": [
            {"big": "a", "title": "张大嘴 a", "image": "😮", "hint": "嘴巴张大，声音响亮。", "mouth": "嘴张大，舌头放平。", "say": "a"},
            {"big": "o", "title": "圆圆嘴 o", "image": "⭕", "hint": "嘴唇收圆。", "mouth": "嘴唇像小圆圈。", "say": "o"},
            {"big": "e", "title": "扁扁嘴 e", "image": "鹅", "hint": "嘴角向两边展开。", "mouth": "嘴巴半开，嘴角微微向两边。", "say": "e"},
            {"big": "ü", "title": "小鱼嘴 ü", "image": "🐟", "hint": "像吹口哨的小圆嘴。", "mouth": "嘴唇撮圆，舌头靠前。", "say": "ü"}
          ],
          "exercises": [
            {"kind": "choice", "prompt": "发 a 时，嘴巴应该怎样？", "answer": "张大", "options": ["张大", "闭紧", "咬住下唇", "鼓起腮"], "tip": "a 是最开的大嘴音。"},
            {"kind": "choice", "prompt": "小鱼嘴是哪一个韵母？", "answer": "ü", "options": ["u", "ü", "e", "o"], "tip": "ü 的上面有两点。"}
          ]
        },
        {
          "id": "pinyin-whole",
          "title": "整体认读家族",
          "icon": "🏠",
          "type": "pinyin",
          "objective": "直接认读 zhi chi shi ri zi ci si yi wu yu。",
          "cards": [
            {"big": "zhi", "title": "整体认读 zhi", "image": "🍊", "hint": "整体读，不拆开拼。", "mouth": "舌尖翘起，声音短而清楚。", "say": "zhi"},
            {"big": "chi", "title": "整体认读 chi", "image": "🥄", "hint": "比 zhi 多一点送气。", "mouth": "舌尖翘起，送出气。", "say": "chi"},
            {"big": "shi", "title": "整体认读 shi", "image": "🦁", "hint": "像“狮”的读音。", "mouth": "舌尖翘起，气流从舌面过。", "say": "shi"},
            {"big": "yu", "title": "整体认读 yu", "image": "🐟", "hint": "小 ü 见到 y，去掉两点还读 ü。", "mouth": "嘴唇撮圆。", "say": "yu"}
          ],
          "exercises": [
            {"kind": "choice", "prompt": "哪个是整体认读音节？", "answer": "shi", "options": ["shi", "sh", "ia", "uo"], "tip": "shi 可以直接读出来。"},
            {"kind": "choice", "prompt": "yu 读起来像哪个韵母？", "answer": "ü", "options": ["u", "ü", "a", "o"], "tip": "yu 是小鱼嘴。"}
          ]
        },
        {
          "id": "pinyin-tones",
          "title": "声调滑梯",
          "icon": "🛝",
          "type": "pinyin",
          "objective": "感受一声平、二声扬、三声拐弯、四声降。",
          "cards": [
            {"big": "mā", "title": "一声", "image": "➖", "hint": "声音平平地走。", "mouth": "音高保持平稳。", "say": "mā"},
            {"big": "má", "title": "二声", "image": "↗️", "hint": "声音往上爬。", "mouth": "从低到高。", "say": "má"},
            {"big": "mǎ", "title": "三声", "image": "〰️", "hint": "先低再上，像小弯钩。", "mouth": "声音拐个弯。", "say": "mǎ"},
            {"big": "mà", "title": "四声", "image": "↘️", "hint": "声音往下落。", "mouth": "短促下降。", "say": "mà"}
          ],
          "exercises": [
            {"kind": "choice", "prompt": "“mǎ”是第几声？", "answer": "三声", "options": ["一声", "二声", "三声", "四声"], "tip": "三声有一个小弯钩。"},
            {"kind": "choice", "prompt": "哪个声调像上坡？", "answer": "二声", "options": ["一声", "二声", "三声", "四声"], "tip": "二声从低往高走。"}
          ]
        },
        {
          "id": "pinyin-ba",
          "title": "b 加 a",
          "icon": "🍌",
          "type": "pinyin",
          "objective": "练习 b + a = ba 的拼读过程。",
          "cards": [
            {"big": "b + a = ba", "title": "两拼音节 ba", "image": "👄", "hint": "声母轻短，韵母响亮，连起来读 ba。", "mouth": "先闭唇发 b，再张大嘴接 a。", "say": "ba"},
            {"big": "bā bá bǎ bà", "title": "ba 的四声", "image": "🎵", "hint": "同一个 ba，声调不同意思会变。", "mouth": "保持 ba 的口型，改变声调。", "say": "bā bá bǎ bà"}
          ],
          "exercises": [
            {"kind": "choice", "prompt": "b + a 拼成什么？", "answer": "ba", "options": ["ba", "pa", "ma", "fa"], "tip": "先 b 后 a，连起来。"},
            {"kind": "choice", "prompt": "“爸爸”的第一个音节常读作？", "answer": "bà", "options": ["bā", "bá", "bǎ", "bà"], "tip": "爸爸的爸是四声。"}
          ]
        },
        {
          "id": "pinyin-ma",
          "title": "m 加 a",
          "icon": "🐴",
          "type": "pinyin",
          "objective": "练习 m + a = ma，并区分妈、麻、马、骂。",
          "cards": [
            {"big": "m + a = ma", "title": "两拼音节 ma", "image": "👩", "hint": "m 从鼻子轻轻发声，再接大嘴 a。", "mouth": "双唇闭住发 m，再张大嘴。", "say": "ma"},
            {"big": "mā má mǎ mà", "title": "ma 的四声", "image": "🐎", "hint": "mǎ 可以想到小马。", "mouth": "读 mǎ 时声音先下再上。", "say": "mā má mǎ mà"}
          ],
          "exercises": [
            {"kind": "choice", "prompt": "“马”的拼音是哪一个？", "answer": "mǎ", "options": ["mā", "má", "mǎ", "mà"], "tip": "马是三声。"},
            {"kind": "choice", "prompt": "m + a 拼成什么？", "answer": "ma", "options": ["ma", "mi", "mo", "mu"], "tip": "韵母是 a。"}
          ]
        },
        {
          "id": "pinyin-shi",
          "title": "shi 小狮子",
          "icon": "🦁",
          "type": "pinyin",
          "objective": "直接认读 shi，并练习四声。",
          "cards": [
            {"big": "shi", "title": "整体认读 shi", "image": "🦁", "hint": "看到 shi 直接读，不拆。", "mouth": "舌尖微翘，牙齿留小缝。", "say": "shi"},
            {"big": "shī shí shǐ shì", "title": "shi 的四声", "image": "📖", "hint": "石头的石读 shí，事情的是读 shì。", "mouth": "同一口型，不同声调。", "say": "shī shí shǐ shì"}
          ],
          "exercises": [
            {"kind": "choice", "prompt": "“石头”的“石”读作？", "answer": "shí", "options": ["shī", "shí", "shǐ", "shì"], "tip": "石是二声。"},
            {"kind": "choice", "prompt": "看到 shi 应该怎样读？", "answer": "整体读", "options": ["整体读", "拆成 s+h+i", "只读 i", "不发声"], "tip": "shi 是整体认读音节。"}
          ]
        },
        {
          "id": "pinyin-review",
          "title": "拼读小复习",
          "icon": "🎒",
          "type": "pinyin",

  <script>
  (function(){
    "use strict";
    var K_CONTENT = "bridgeDesk.content.v1";
    var K_PROGRESS = "bridgeDesk.progress.v1";
    var encouragement = ["你发现啦！","很棒，再试一题！","答对了，继续观察！","做得好，慢慢来！"];
    var gentle = ["再看一看，差一点点。","没关系，换个角度想想。","再试一次，你可以慢慢选。"];
    var state = {
      content:null, progress:null, sectionId:null, lessonId:null, cardIndex:0,
      answers:{}, order:{}, classify:{}, match:{}, memory:{}, spot:{}, maze:{},
      editor:{open:false, path:["sections",0]}
    };

    function $(sel, root){ return (root || document).querySelector(sel); }
    function $all(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
    function clone(x){ return JSON.parse(JSON.stringify(x)); }
    function shuffle(arr){
      var a = arr.slice();
      for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
      return a;
    }
    function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
    function esc(s){
      return String(s == null ? "" : s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});
    }
    function pathKey(sectionId, lessonId){ return sectionId + "::" + lessonId; }
    function nowText(){
      var d = new Date();
      return (d.getMonth()+1) + "月" + d.getDate() + "日 " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    }
    function defaultContent(){
      return JSON.parse($("#default-content").textContent);
    }
    async function loadContent(){
      var saved = localStorage.getItem(K_CONTENT);
      if(saved){
        try { return JSON.parse(saved); } catch(e) { localStorage.removeItem(K_CONTENT); }
      }
      var data = null;
      try {
        var res = await fetch("content.json", {cache:"no-store"});
        if(res.ok) data = await res.json();
      } catch(e) {}
      if(!data) data = defaultContent();
      localStorage.setItem(K_CONTENT, JSON.stringify(data));
      return data;
    }
    function loadProgress(){
      try { return JSON.parse(localStorage.getItem(K_PROGRESS)) || {lessons:{},recent:[]}; }
      catch(e){ return {lessons:{},recent:[]}; }
    }
    function saveContent(){ localStorage.setItem(K_CONTENT, JSON.stringify(state.content)); }
    function saveProgress(){ localStorage.setItem(K_PROGRESS, JSON.stringify(state.progress)); }
    function allSections(){
      var sections = state.content.sections || [];
      if(sections.some(function(s){ return s.id === "results"; })) return sections;
      return sections.concat([{id:"results",title:"学习成果",icon:"📈",color:"#f5f0ff",lessons:[],virtual:true}]);
    }
    function getSection(){
      return allSections().find(function(s){return s.id===state.sectionId;}) || allSections()[0];
    }
    function getLesson(section){
      if(!section || section.virtual) return null;
      return section.lessons.find(function(l){return l.id===state.lessonId;}) || section.lessons[0];
    }
    function sectionStats(section){
      if(section.virtual) return {done:0,total:1,attempts:0,correct:0};
      var done = 0, attempts = 0, correct = 0;
      section.lessons.forEach(function(l){
        var p = state.progress.lessons[pathKey(section.id,l.id)];
        if(p && (p.views || p.correct)) done++;
        if(p){ attempts += p.attempts || 0; correct += p.correct || 0; }
      });
      return {done:done,total:Math.max(1,section.lessons.length),attempts:attempts,correct:correct};
    }
    function markViewed(section, lesson){
      if(!section || !lesson || section.virtual) return;
      var key = pathKey(section.id, lesson.id);
      var p = state.progress.lessons[key] || {views:0,attempts:0,correct:0,known:[]};
      if(!p.known) p.known = [];
      p.views = (p.views || 0) + 1;
      if(p.known.indexOf(lesson.title) < 0) p.known.push(lesson.title);
      state.progress.lessons[key] = p;
      saveProgress();
    }
    function record(section, lesson, ok, label){
      if(!section || !lesson || section.virtual) return;
      var key = pathKey(section.id, lesson.id);
      var p = state.progress.lessons[key] || {views:0,attempts:0,correct:0,known:[]};
      p.attempts = (p.attempts || 0) + 1;
      if(ok) p.correct = (p.correct || 0) + 1;
      if(!p.known) p.known = [];
      if(p.known.indexOf(lesson.title) < 0) p.known.push(lesson.title);
      state.progress.lessons[key] = p;
      state.progress.recent = state.progress.recent || [];
      state.progress.recent.unshift({time:nowText(), section:section.title, lesson:lesson.title, label:label || "练习", ok:!!ok});
      state.progress.recent = state.progress.recent.slice(0,30);
      saveProgress();
      renderNav();
    }
    function speak(text, type){
      var box = $("#voiceNote");
      if(!("speechSynthesis" in window)){
        if(box) box.textContent = "此浏览器没有离线朗读功能，请家长读一读。";
        return;
      }
      var u = new SpeechSynthesisUtterance(String(text || ""));
      u.lang = type === "english" ? "en-US" : "zh-CN";
      u.rate = type === "english" ? 0.82 : 0.85;
      u.pitch = 1.08;
      var voices = speechSynthesis.getVoices();
      var matched = voices.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf(u.lang.toLowerCase().slice(0,2)) === 0; });
      if(matched) u.voice = matched;
      if(box && !matched) box.textContent = "如果没有听到声音，请家长读一读。";
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }
    function render(){
      var app = $("#app");
      app.innerHTML = '<aside class="side"><div id="navHeader"></div><div id="navList" class="nav-list"></div></aside><main id="main" class="main"></main>';
      renderNav();
      renderMain();
    }
    function renderNav(){
      var sections = allSections();
      var current = getSection();
      var stats = sectionStats(current);
      $("#navHeader").innerHTML =
        '<div class="kid-card">' +
          '<div class="kid-row"><div class="avatar">🌱</div><div><input id="kidName" class="kid-name" value="' + esc(state.content.childName || "小朋友") + '" aria-label="孩子昵称"><div class="small">当前主题：' + esc(current.title) + '</div></div></div>' +
          '<div class="small">本主题进度 ' + stats.done + '/' + stats.total + ' · 正确率 ' + pct(stats.correct, stats.attempts) + '%</div>' +
          '<div class="progress-bar"><div class="progress-fill" style="width:' + pct(stats.done,stats.total) + '%"></div></div>' +
        '</div>';
      $("#navList").innerHTML = sections.map(function(s){
        var st = sectionStats(s);
        return '<button class="nav-btn ' + (s.id===state.sectionId?'active':'') + '" data-nav="' + esc(s.id) + '">' +
          '<span class="nav-icon">' + esc(s.icon) + '</span><span>' + esc(s.title) + '<span class="nav-meta">' + ((s.virtual || s.id === "results") ? "查看记录" : (st.done + "/" + st.total + " 已学")) + '</span></span></button>';
      }).join("");
      $("#kidName").addEventListener("input", function(e){ state.content.childName = e.target.value || "小朋友"; saveContent(); });
      $all("[data-nav]").forEach(function(btn){
        btn.addEventListener("click", function(){
          state.sectionId = btn.getAttribute("data-nav");
          var sec = getSection();
          state.lessonId = sec.lessons && sec.lessons[0] ? sec.lessons[0].id : null;
          state.cardIndex = 0;
          state.answers = {}; state.order = {}; state.classify = {}; state.match = {}; state.memory = {}; state.spot = {}; state.maze = {};
          render();
        });
      });
    }
    function renderMain(){
      var section = getSection();
      if(section.virtual || section.id === "results"){ renderResults(); return; }
      var lesson = getLesson(section);
      if(!lesson) return;
      state.lessonId = lesson.id;

    function generatedExercises(lesson){
      var g = lesson.generator;
      var id = lesson.id;
      if(!state.answers[id + ":batch"]) state.answers[id + ":batch"] = Math.random().toString(36).slice(2);
      var out = [];
      for(var i=0;i<5;i++){
        if(g.kind === "count" || g.kind === "quantity"){
          var n = rand(g.min,g.max), item = (g.items || ["⭐"])[rand(0,(g.items||["⭐"]).length-1)];
          out.push({kind:"choice", prompt:"数一数： " + repeat(item,n), answer:String(n), options:numberOptions(n,g.min,g.max), tip:"一个一个点着数。"});
        } else if(g.kind === "number"){
          var x = rand(g.min,g.max);
          out.push({kind:"choice", prompt:"这个数字怎么读？ " + x, answer:cnNum(x), options:shuffle([cnNum(x),cnNum((x+1)%21),cnNum(Math.max(0,x-1)),cnNum(rand(g.min,g.max))]).slice(0,4), tip:"看清十位和个位。"});
        } else if(g.kind === "compare"){
          var a = rand(g.min,g.max), b = rand(g.min,g.max);
          var ans = a>b ? ">" : (a<b ? "<" : "=");
          out.push({kind:"choice", prompt:"比较大小： " + a + "  ?  " + b, answer:ans, options:[">","<","="], tip:"开口朝向大的数。"});
        } else if(g.kind === "addsub"){
          var add = Math.random() > .45, m = rand(1,g.max), n = rand(1,g.max);
          if(add && m+n>20) n = 20-m;
          if(!add && n>m){ var t=m; m=n; n=t; }
          var r = add ? m+n : m-n;
          out.push({kind:"choice", prompt:m + (add ? " + " : " - ") + n + " = ?", answer:String(r), options:numberOptions(r,0,20), tip:add ? "合起来，用加法。" : "拿走一些，用减法。"});
        } else if(g.kind === "pattern"){
          var patterns = [["🔴","🔵"],["⭐","🌙"],["△","□","○"],["🍎","🍌","🍌"]];
          var p = patterns[rand(0,patterns.length-1)];
          var seq = [];
          for(var k=0;k<5;k++) seq.push(p[k % p.length]);
          var answer = p[5 % p.length];
          out.push({kind:"choice", prompt:"找规律：" + seq.join(" ") + " ?", answer:answer, options:shuffle([answer].concat(["🔴","🔵","⭐","🌙","△","□","○","🍎","🍌"].filter(function(v){return v!==answer;}))).slice(0,4), tip:"找到重复的一组。"});
        }
      }
      return out;
    }
    function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
    function repeat(s,n){ var r=[]; for(var i=0;i<n;i++) r.push(s); return r.join(" "); }
    function numberOptions(ans,min,max){

    function cnNum(n){
      var a=["零","一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十"];
      return a[n] || String(n);

            (state.classify[cid] ? '<div class="feedback ' + (state.classify[cid].ok?'ok':'no') + '">' + esc(state.classify[cid].msg) + '</div>' : '');
          }).join("") + '</div>';
      }
      if(ex.kind === "speak"){
        return '<div class="exercise" data-ex="' + i + '"><h3>' + esc(ex.prompt) + '</h3><button class="primary" data-said>我说完了</button>' + fb + '</div>';
      }
      if(ex.kind === "spot"){
        if(state.spot[id] == null) state.spot[id] = rand(0,(ex.size||16)-1);
        var cells = [];
        for(var s=0;s<(ex.size||16);s++) cells.push('<button data-spot="' + s + '">' + esc(s===state.spot[id] ? ex.different : ex.same) + '</button>');
        return '<div class="exercise" data-ex="' + i + '"><h3>' + esc(ex.prompt) + '</h3><div class="spot-grid" style="grid-template-columns:repeat(4,48px)">' + cells.join("") + '</div>' + fb + '</div>';
      }
      if(ex.kind === "memory"){
        var show = state.memory[id] && state.memory[id].show;
        var seq = (ex.sequence||[]).join(" ");
        return '<div class="exercise" data-ex="' + i + '"><h3>' + esc(ex.prompt) + '</h3>' +
          '<div class="memory-box">' + esc(show ? seq : "已盖住") + '</div>' +
          '<div class="card-actions"><button data-memory-show>' + (show ? "盖住" : "开始记忆") + '</button></div>' +
          '<div class="choice-grid">' + shuffle(ex.options||[]).map(function(o){return '<button data-choice="' + esc(o) + '">' + esc(o) + '</button>';}).join("") + '</div>' + fb + '</div>';
      }
      if(ex.kind === "maze"){
        var rows = ex.grid || [];
        var done = state.maze[id] || 0;
        var cellsHtml = "";
        rows.forEach(function(row,r){
          row.split("").forEach(function(ch,c){

    function exId(lesson,i){ return lesson.id + ":" + i; }
    function setFeedback(id, ok, tip){

    function bindExercises(section, lesson, list){

        $all("[data-choice]", box).forEach(function(btn){

            var val = btn.getAttribute("data-choice");
            var ans = ex.kind === "judge" ? String(ex.answer) : String(ex.answer || (ex.sequence||[]).join(" "));
            var ok = val === ans;
            setFeedback(id, ok, ex.tip);
            record(section, lesson, ok, ex.prompt);
            renderPractice(section, lesson);
          });
        });
        $all("[data-match]", box).forEach(function(btn){
          btn.addEventListener("click", function(){
            var pi = Number(btn.getAttribute("data-match"));
            var ok = btn.getAttribute("data-choice") === String(ex.pairs[pi].right);
            state.match[id + ":m:" + pi] = {ok:ok,msg:ok?encouragement[rand(0,encouragement.length-1)]:(gentle[rand(0,gentle.length-1)])};

        var check = $("[data-order-check]", box);

    function fieldHtml(val,path,key){
      if(Array.isArray(val)){
        return '<div class="array-box"><div class="array-head"><strong>' + esc(label(key)) + '</strong><button class="mini primary" data-add="' + esc(path.join(",")) + '" data-key="' + esc(key) + '">添加</button></div>' +
          val.map(function(item,i){
            var p = path.concat([i]);
            if(item && typeof item === "object"){
              return '<div class="item-card"><div class="item-actions"><button class="mini" data-up="' + esc(p.join(",")) + '">↑</button><button class="mini" data-down="' + esc(p.join(",")) + '">↓</button><button class="mini warn" data-del="' + esc(p.join(",")) + '">删除</button></div>' + fieldHtml(item,p,key + i) + '</div>';
            }
            return '<div class="field"><label>' + esc(label(key)) + ' ' + (i+1) + '</label><input data-path="' + esc(p.join(",")) + '" value="' + esc(item) + '"><button class="mini warn" data-del="' + esc(p.join(",")) + '">删除</button></div>';
          }).join("") + '</div>';
      }
      if(val && typeof val === "object"){
        return Object.keys(val).map(function(k){ return fieldHtml(val[k],path.concat([k]),k); }).join("");
      }
      if(typeof val === "boolean"){
        return '<div class="field"><label>' + esc(label(key)) + '</label><select data-path="' + esc(path.join(",")) + '"><option value="true" ' + (val?'selected':'') + '>对 / true</option><option value="false" ' + (!val?'selected':'') + '>不对 / false</option></select></div>';
      }
      var isLong = String(val || "").length > 34 || key === "story" || key === "hint" || key === "objective" || key === "prompt";
      return '<div class="field"><label>' + esc(label(key)) + '</label>' + (isLong ? '<textarea data-path="' + esc(path.join(",")) + '">' + esc(val) + '</textarea>' : '<input data-path="' + esc(path.join(",")) + '" value="' + esc(val) + '">') + '</div>';
    }
    function bindForm(root){
      $all("[data-path]",root).forEach(function(el){
        el.onchange = el.oninput = function(){
          var p = parsePath(el.getAttribute("data-path"));
          var old = getByPath(p);
          var v = el.value;
          if(typeof old === "number") v = Number(v);
          if(typeof old === "boolean") v = v === "true";
          setByPath(p,v);
          renderNav();
        };
      });
      $all("[data-add]",root).forEach(function(btn){ btn.onclick = function(){ addAt(parsePath(btn.getAttribute("data-add")), btn.getAttribute("data-key")); renderEditor(); }; });
      $all("[data-del]",root).forEach(function(btn){ btn.onclick = function(){ deleteAt(parsePath(btn.getAttribute("data-del"))); renderEditor(); }; });
      $all("[data-up]",root).forEach(function(btn){ btn.onclick = function(){ moveAt(parsePath(btn.getAttribute("data-up")),-1); renderEditor(); }; });
      $all("[data-down]",root).forEach(function(btn){ btn.onclick = function(){ moveAt(parsePath(btn.getAttribute("data-down")),1); renderEditor(); }; });
    }
    function parsePath(s){ return s.split(",").filter(Boolean).map(function(x){return /^\d+$/.test(x)?Number(x):x;}); }
    function parentPath(path){ return path.slice(0,path.length-1); }
    function deleteAt(path){
      var arr = getByPath(parentPath(path));
      arr.splice(path[path.length-1],1);
      saveContent();
      state.editor.path = ["sections",0];
    }
    function moveAt(path,dir){
      var arr = getByPath(parentPath(path)), i = path[path.length-1], j = i + dir;
      if(j<0 || j>=arr.length) return;
      var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
      path[path.length-1]=j; state.editor.path=path; saveContent();
    }
    function addAt(path,key){
      var arr = getByPath(path);
      arr.push(newItemFor(key));
      saveContent();
    }
    function newItemFor(key){
      if(key === "sections") return newSection();
      if(key === "lessons") return newLesson();
      if(key === "cards") return {big:"新卡片",title:"新学习卡",image:"🌟",hint:"这里写提示",say:"新卡片"};
      if(key === "exercises") return {kind:"choice",prompt:"新问题",answer:"选项一",options:["选项一","选项二","选项三"],tip:"这里写提示"};
      if(key === "pairs") return {left:"左侧",right:"右侧"};
      if(key === "groups") return {name:"新类别",items:["项目"]};
      if(key === "path") return [0,0];
      return "新内容";
    }
    function newSection(){
      return {id:"section-" + Date.now(),title:"新板块",icon:"🌟",color:"#e0f1ff",lessons:[newLesson()]};
    }
    function newLesson(){
      return {id:"lesson-" + Date.now(),title:"新主题",icon:"🌱",type:"custom",objective:"写下学习目标",cards:[{big:"新内容",title:"新学习卡",image:"🌱",hint:"写下提示",say:"新内容"}],exercises:[{kind:"choice",prompt:"请选择正确答案",answer:"正确",options:["正确","再想想"],tip:"温和提示"}]};
    }
    function exportJson(){
      var blob = new Blob([JSON.stringify(state.content,null,2)], {type:"application/json"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "content.json";
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    }
    function importJson(e){
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        try{
          var data = JSON.parse(reader.result);
          if(!data.sections) throw new Error("missing sections");
          state.content = data; saveContent(); state.sectionId = data.sections[0].id; state.lessonId = data.sections[0].lessons[0].id; renderEditor(); render();
        }catch(err){ alert("导入失败：请选择正确的 content.json"); }
      };
      reader.readAsText(file);
    }
    $("#parentEntry").onclick = openEditor;
    loadContent().then(function(data){
      state.content = data;
      state.progress = loadProgress();
      state.sectionId = data.sections[0] && data.sections[0].id;
      state.lessonId = data.sections[0] && data.sections[0].lessons[0] && data.sections[0].lessons[0].id;
      render();
      if("speechSynthesis" in window) speechSynthesis.onvoiceschanged = function(){};
    });
  })();
  </script>
</body>
</html>
